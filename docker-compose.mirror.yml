x-disabled-for-mirror:
  &disabled-for-mirror
  entrypoint: "echo 'service disabled; mirror'"
  restart: "no"

# -- LIVE BACKUP (MIRROR) --
# This docker-compose file serves as the base configuration for running a
# Kaleidos server in mirroring mode. Servers running in mirror mode should
# !!UPDATE THEIR .env FILE TO USE THIS YAML FILE!!
# or use the following command when working with the stack:
# > drc {up,down,...} -f docker-compose.yml -f docker-compose.mirror.yml -f docker-compose.mirror.override.yml
#
# Note that this YAML file contains the base config of the mirroring server,
# you should still use the docker-compose.mirror.override.yml file to override
# server-specific environment variables.

services:
  # Required services:
  # - delta-consumer
  # - database
  # - triplestore
  # - search
  # - elasticsearch
  # - tika
  # - delta-notifier

  # delta-consumer base configuration
  # You should set the following options in docker-compose.mirror.override.yml:
  # - DRC_SYNC_BASE_URL: URL of the host running the delta producer, which you want to mirror
  # - DCR_SECRET_KEY: Secret key that is set by the producer
  # This service will fail to start if they are left unset
  delta-consumer:
    image: kanselarij/delta-consumer:0.0.1
    environment:
      DCR_SERVICE_NAME: 'consume-from-sync'
      DCR_DELTA_SYNC_JOB_OPERATION: "http://delta-consumer.services.semantic.works/id/JobOperation/DeltaFileSyncing"
      DCR_JOB_CREATOR_URI: "http://delta-consumer.services.semantic.works/me"
      DCR_START_FROM_DELTA_TIMESTAMP: "2023-09-13T14:40:00Z"
      DCR_WAIT_FOR_INITIAL_SYNC: "false"
      DCR_DISABLE_INITIAL_SYNC: "true"
      DCR_DELTA_FILE_FOLDER: "/delta-files"
      DCR_KEEP_DELTA_FILES: "true"
      DCR_CRON_PATTERN_DELTA_SYNC: "*/15 * * * * *"
      DOWNLOAD_SHARE_LINKS: "true"
    volumes:
      - ./data/files:/share
      - ./data/delta-files:/delta-files
      - ./config/consumer/example-custom-dispatching:/config
  delta-notifier:
    volumes:
      - ./config/delta/mirror-rules.js:/config/rules.js

  # Disable extraneous services
  identifier:
    <<: *disabled-for-mirror
  dispatcher:
    <<: *disabled-for-mirror
