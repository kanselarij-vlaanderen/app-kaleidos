x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
x-extended-logging:
  &extended-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "20"
services:
  project-scripts:
    image: semtech/simple-script-store:1.0.0
    volumes:
      - ./config/project-scripts:/app/scripts
  identifier:
    image: semtech/mu-identifier:feature-custom-session-handling
    environment:
      SESSION_COOKIE_SECURE: "on"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  dispatcher:
    image: semtech/mu-dispatcher:feature-big-chunks
    volumes:
      - ./config/dispatcher:/config
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  frontend:
    image: kanselarij/frontend-kaleidos:11.0.0
    environment:
      EMBER_OAUTH_CLIENT_ID: "b1c78c1e-3c88-44f4-90fa-bebc5c5dc28d"
      EMBER_OAUTH_BASE_URL: "https://authenticatie-ti.vlaanderen.be/op/v1/auth"
      EMBER_OAUTH_REDIRECT_URL: "https://kaleidos-dev.vlaanderen.be/authorization/callback"
      EMBER_OAUTH_LOGOUT_URL: "https://authenticatie-ti.vlaanderen.be/op/v1/logout"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  migrations:
    image: semtech/mu-migrations-service:0.9.0
    volumes:
      - ./config/migrations:/data/migrations
    environment:
      MU_SPARQL_ENDPOINT: "http://triplestore:8890/sparql"
      MU_SPARQL_TIMEOUT: 300
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  database:
    image: semtech/sparql-parser:feature-improved-type-comparison
    volumes:
      - ./config/authorization:/config
      - ./data/mu-cl-authorization:/data/
    logging: *extended-logging
    restart: always
    labels:
      - "logging=true"
  triplestore:
    image: redpencil/virtuoso:1.4.0
    environment:
      SPARQL_UPDATE: "true"
      DEFAULT_GRAPH: "http://mu.semte.ch/application"
    volumes:
      - ./data/db:/data
      - ./config/db/virtuoso.ini:/data/virtuoso.ini
      - ./config/db/:/opt/virtuoso-scripts
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  search:
    image: semtech/mu-search:0.11.0
    volumes:
      - ./config/search:/config
      - ./data/files:/data
      - ./data/tika/cache:/cache
    environment:
      NUMBER_OF_THREADS: 16
      JRUBY_OPTIONS: "-J-Xmx32g" # overwrite for development
      LOG_LEVEL: "info"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  elasticsearch:
    image: semtech/mu-search-elastic-backend:1.2.0
    environment:
      discovery.type: "single-node"
    volumes:
      - ./data/elasticsearch/:/usr/share/elasticsearch/data
    logging: *default-logging
    restart: always
  tika:
    image: semtech/mu-search-tika-backend:1.0.0
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  delta-notifier:
    image: semtech/mu-delta-notifier:feature-node26
    volumes:
      - ./config/delta:/config
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  cache-warmup:
    image: kanselarij/cache-warmup-service:feature-node26
    # image: kanselarij/cache-warmup-service:1.16.0
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
    environment:
      CONCEPT_BACKEND_URL: "http://forever-cache/"
      ALLOW_MU_AUTH_SUDO: "true"
  cache:
    image: semtech/mu-cache:2.2.0
    links:
      - resource:backend
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  forever-cache:
    image: semtech/mu-cache:2.0.2
    links:
      - resource:backend
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  resource:
    image: semtech/mu-cl-resources:feature-empty-allowed-groups-in-delta
    environment:
      CACHE_CLEAR_PATH: "http://cache/.mu/clear-keys"
      LISP_DYNAMIC_SPACE_SIZE: "1024" # 1GB by default, increase to 8GB on systems with a lot of data
    volumes:
      - ./config/resources:/config
    logging: *extended-logging
    restart: always
    labels:
      - "logging=true"
  file:
    image: semtech/mu-file-service:3.4.0
    environment:
      FILE_RESOURCE_BASE: "http://themis.vlaanderen.be/id/bestand/"
    volumes:
      - ./data/files:/share
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  static-file:
    image: semtech/static-file-service:0.2.0
    volumes:
      - ./data/static-files:/data
  agenda-comparison:
    # image: kanselarij/agenda-comparison-service:3.2.0
    image: kanselarij/agenda-comparison-service:feature-node26
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  agenda-approve:
    image: kanselarij/agenda-approve-service:5.12.0
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  mocklogin:
    image: kanselarij/mock-login-service:2.4.0
    logging: *default-logging
    labels:
      - "logging=true"
  login:
    # image: kanselarij/acmidm-login-service:2.4.3
    image: kanselarij/acmidm-login-service:feature-node26
    environment:
      MU_APPLICATION_AUTH_DISCOVERY_URL: "https://authenticatie-ti.vlaanderen.be/op"
      MU_APPLICATION_AUTH_CLIENT_ID: "b1c78c1e-3c88-44f4-90fa-bebc5c5dc28d"
      MU_APPLICATION_AUTH_REDIRECT_URI: "https://kaleidos-dev.vlaanderen.be/authorization/callback"
      MU_APPLICATION_AUTH_CLIENT_SECRET: "THIS IS OUR SECRET"
      DEBUG_LOG_TOKENSETS: "true"
      LOG_SINK_URL: "http://sink"
      ALLOW_MU_AUTH_SUDO: "true"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  newsletter:
    image: kanselarij/newsletter-service:feature-node26
    volumes:
      - ./data/generated-xmls:/data
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  yggdrasil:
    image: kanselarij/yggdrasil:feature-node26
    logging: *default-logging
    restart: always
    environment:
      ALLOW_SPARQL_CLIENT_2: "true"
    labels:
      - "logging=true"
  sink:
    image: lblod/sink-service:1.0.0
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  file-bundling:
    image: kanselarij/file-bundling-service:feature-node26
    environment:
      MU_APPLICATION_FILE_STORAGE_PATH: "generated-archives/"
      ALLOW_MU_AUTH_SUDO: "true"
    volumes:
      - ./data/files:/share
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  docx-conversion:
    image: kanselarij/docx-conversion-service:feature-node26
    volumes:
      - ./data/files:/share
    environment:
      ALLOW_MU_AUTH_SUDO: "true"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  database-healthcheck:
    image: kanselarij/database-healthcheck:feature-node26
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  case-documents-sync:
    image: kanselarij/case-documents-sync-service:feature-node26
    logging: *default-logging
    restart: always
    environment:
      MAX_BODY_SIZE: "500kb"
      ALLOW_MU_AUTH_SUDO: "true"
    labels:
      - "logging=true"
  gov-field-sync:
    image: kanselarij/gov-field-sync-service:feature-node26
    environment:
      ALLOW_MU_AUTH_SUDO: "true"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  document-versions:
    image: kanselarij/document-versions-service:feature-node26
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  document-release:
    image: kanselarij/document-release-service:feature-node26
    environment:
      ALLOW_MU_AUTH_SUDO: "true"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  mail-delivery:
    image: redpencil/deliver-email-service:feature-node26
    environment:
      MAILBOX_URI: "http://themis.vlaanderen.be/id/mailboxes/e8364a49-2696-48cc-aef1-e1e396a0cd34"
      WELL_KNOWN_SERVICE: "test"
      EMAIL_ADDRESS: "noreply@kaleidos.vlaanderen.be"
      EMAIL_CRON_PATTERN: "*/5 * * * *"
      EMAIL_PROTOCOL: "MS_Graph_API"
      MS_GRAPH_API_CLIENT_ID: "51148b88-fd95-43ea-aefc-442af419f11e"
      MS_GRAPH_API_TENANT_ID: "0c0338a6-9561-4ee8-b8d6-4e89cbd520a0"
      MS_GRAPH_API_CLIENT_SECRET: "OUR SECRET"
      ALLOW_MU_AUTH_SUDO: "true"
    volumes:
      - ./data/files:/share
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  lod-sbmb:
    # Trigger needs to be configured in server cron
    # cd /data/app-kaleidos && /usr/local/bin/docker-compose run lod-sbmb -g -s $(date +\%Y) -e $(date +\%Y) -n decreet -f decret -t DECREE -o /data -c /data/cache -w 10 && mv ./data/staatsblad/decreet* ./data/staatsblad/nl && mv ./data/staatsblad/decret* ./data/staatsblad/fr
    # cd /data/app-kaleidos && /usr/local/bin/docker-compose run lod-sbmb -g -s $(date +\%Y) -e $(date +\%Y) -n besluit -f arrete -t DECISION -o /data -c /data/cache -w 10 && mv ./data/staatsblad/besluit* ./data/staatsblad/nl && mv ./data/staatsblad/arrete* ./data/staatsblad/fr
    image: kanselarij/lod-sbmb:1.11.0
    volumes:
      - ./data/staatsblad:/data
    restart: "no" # restart disabled on purpose. Service is triggered by server cron and should not always run
    logging: *default-logging
  staatsblad-scraping:
    image: kanselarij/staatsblad-scraping-service:1.0.0
    environment:
      CRON_PATTERN: "20 */7 * * *"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  staatsblad-import:
    image: kanselarij/ttl-import-service:feature-node26
    volumes:
      - ./data/staatsblad/nl:/data/imports
    environment:
      GRAPH: "http://mu.semte.ch/graphs/staatsblad"
      ALLOW_MU_AUTH_SUDO: "true"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  staatsblad-uuid-generation:
    image: redpencil/uuid-generation:feature-node26
    environment:
      RUN_CRON_JOBS: "true"
      ALLOW_MU_AUTH_SUDO: "true"
    volumes:
      - ./config/uuid-generation/:/config
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  staatsblad-linking:
    image: kanselarij/staatsblad-linking-service:feature-node26
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
    environment:
      ALLOW_MU_AUTH_SUDO: "true"
  publication-report:
    image: kanselarij/publication-report-service:feature-node26
    volumes:
      - ./data/files:/share
    environment:
      MU_SPARQL_ENDPOINT: "http://database:8890/sparql"
      VIRTUOSO_SPARQL_ENDPOINT: "http://triplestore:8890/sparql"
      ALLOW_MU_AUTH_SUDO: "true"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  decision-extraction:
    image: kanselarij/decision-extraction-service:feature-node26
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
    volumes:
      - ./data/files:/share
  delta-producer:
    image: kanselarij/delta-producer-json-diff-file-publisher:feature-node26
    environment:
      ALLOW_MU_AUTH_SUDO: "true"
      PUBLISHER_URI: "http://delta-producer-json-diff-file-publisher.services.semantic.works/me"
      PRETTY_PRINT_DIFF_JSON: "true"
      KEY: "secret-sync-key"
    volumes:
      - ./data/files:/share
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  fileshare:
    image: redpencil/file-share-sync:feature-node26
    environment:
      ALLOW_MU_AUTH_SUDO: "true"
      ALLOW_SUPER_CONSUMER: "true"
    volumes:
      - ./data/files:/share
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  impersonation:
    image: kanselarij/impersonation-service:feature-node26
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  decision-report-generation:
    image: kanselarij/decision-report-generation-service:feature-node26
    environment:
      TZ: "Europe/Brussels"
      ALLOW_MU_AUTH_SUDO: "true"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
    volumes:
      - ./data/files:/share
  shortlist:
    image: kanselarij/shortlist-service:feature-node26
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  minutes-report-generation:
    image: kanselarij/minutes-report-generation-service:feature-node26
    volumes:
      - ./data/files:/share
  digital-signing:
    image: kanselarij/digital-signing-service:2.3.0
    volumes:
      - ./data/files:/share
    restart: always
  signflow-status-sync:
    image: kanselarij/signflow-status-sync-service:feature-node26
    restart: always
    environment:
      ALLOW_MU_AUTH_SUDO: "true"
  #themis
  public-file:
    image: kanselarij/public-file-service:4.3.0
    environment:
      MU_SPARQL_ENDPOINT: "http://triplestore:8890/sparql"
      MU_APPLICATION_GRAPH: "http://mu.semte.ch/graphs/organizations/kanselarij"
    volumes:
      - ./data/files:/share
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  themis-export:
    image: kanselarij/themis-export-service:feature-node26
    environment:
      MU_SPARQL_ENDPOINT: "http://database:8890/sparql" # database for results for which delta's must be generated
      VIRTUOSO_SPARQL_ENDPOINT: "http://triplestore:8890/sparql" # database for intermediate results and to export data from
      ALLOW_MU_AUTH_SUDO: "true"
      ALLOW_SPARQL_CLIENT_2: "true"
    volumes:
      - ./data/exports:/share
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  ttl-to-delta:
    image: kanselarij/ttl-to-delta-service:feature-node26
    environment:
      TASK_GRAPH: "http://mu.semte.ch/graphs/themis-public"
      FILE_GRAPH: "http://mu.semte.ch/graphs/themis-public"
    volumes:
      - ./data/exports:/share
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  publication-producer:
    image: kanselarij/themis-publication-producer:feature-node26
    environment:
      ALLOW_MU_AUTH_SUDO: "true"
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  export-file:
    image: kanselarij/public-file-service:4.3.2
    environment:
      SKIP_CONFIDENTIALITY: "true"
      SPECIFIED_GRAPH: "http://mu.semte.ch/graphs/themis-public"
    volumes:
      - ./data/exports:/share
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  html-to-pdf:
    image: kanselarij/html-to-pdf-service:0.0.1
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  pdf-flattener:
    image: kanselarij/pdf-flattener-service:feature-node26
    volumes:
      - ./data/files:/share
    environment:
      MU_APPLICATION_FILE_STORAGE_PATH: 'flattened-pdfs'
      ALLOW_MU_AUTH_SUDO: "true"
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  pdf-signature-remover:
    image: kanselarij/pdf-signature-remover:feature-node26
    volumes:
      - ./data/files:/share
    environment:
      MU_APPLICATION_FILE_STORAGE_PATH: 'signature-removed-pdfs'
