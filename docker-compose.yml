    restart: always
    labels:
      - "logging=true"
  data-monitoring:
    image: kanselarij/data-monitoring-service:feature-node26
    environment:
      THEMIS_ENDPOINT_URL: "https://themis-dev.kanselarij.org/"
      ALLOW_MU_AUTH_SUDO: "true"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  metrics:
    image: lblod/metrics-service:feature-node26
    environment:
      ALLOW_MU_AUTH_SUDO: "true"
    volumes:
      - ./config/metrics:/config
      - ./data/metrics:/external-metrics

