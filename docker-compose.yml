    labels:
      - logging=true
    restart: always
    logging: *default-logging
  document-stamping:
    image: kanselarij/document-stamping-service:feature-node26
    volumes:
      - ./data/files:/share
    environment:
      MU_APPLICATION_FILE_STORAGE_PATH: 'stamped-pdfs'
    restart: always
    logging: *default-logging
  draft-file:
    image: kanselarij/draft-file-service:0.0.3
    environment:
